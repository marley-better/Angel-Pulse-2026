<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>better angel pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@200;300;400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ── better ventures · angel pulse ──────────────────────────────────────────
   CI: beige ground, navy ink, yellow primary, green accents, accent-red pop.
   Headlines = Helvetica Neue Bold UPPERCASE · Body = Onest · brand terms lower. */
:root{
  --yellow:#FFB902; --yellow-lt:#FFDA7B; --green:#7ABBA3; --green-lt:#BCE8CC;
  --beige:#F5F1E8; --red-lt:#FC9C81; --red:#FE6C3A; --navy:#283244; --blue-lt:#99B2E0;
  --paper:#F5F1E8; --surface:#FFFFFF; --surface-2:#FBF9F4;
  --ink:#283244; --muted:#6A7383; --line:#E6E1D4;
  --accent:#FFB902; --on-accent:#283244;
  --ring:#7ABBA355;
  --sel:#BCE8CC; --rbd:#283244; --rbg:#283244; --rfg:#F5F1E8;
  --btn:#283244; --on-btn:#F5F1E8; --greenink:#2E6B55; --amp1:#E0932B; --amp2:#2E8B6B;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#20293A; --surface:#283244; --surface-2:#2E394D;
  --ink:#F5F1E8; --muted:#A7B0C0; --line:#3A465C; --accent:#FFB902; --on-accent:#283244; --ring:#7ABBA366;
  --sel:#35604F; --rbd:#FFB902; --rbg:#FFB902; --rfg:#283244;
  --btn:#F5F1E8; --on-btn:#283244; --greenink:#9FD9C2; --amp1:#F0B757; --amp2:#9FD9C2;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#20293A; --surface:#283244; --surface-2:#2E394D;
  --ink:#F5F1E8; --muted:#A7B0C0; --line:#3A465C; --accent:#FFB902; --on-accent:#283244; --ring:#7ABBA366;
  --sel:#35604F; --rbd:#FFB902; --rbg:#FFB902; --rfg:#283244;
  --btn:#F5F1E8; --on-btn:#283244; --greenink:#9FD9C2; --amp1:#F0B757; --amp2:#9FD9C2;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif; font-weight:400; font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100%}
img{max-width:100%}
[hidden]{display:none!important}
.disp{font-family:"Helvetica Neue","Helvetica Neue LT Std",Helvetica,Arial,sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.005em}
.sig{font-family:"Caveat",cursive; font-weight:700}

.rail{position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0; height:5px; background:var(--line); z-index:20}
.rail > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--green),var(--greenink)); transition:width .45s cubic-bezier(.4,0,.2,1)}
.top{position:fixed; top:calc(env(safe-area-inset-top,0px) + 5px); left:0; right:0; z-index:19;
  display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px clamp(16px,5vw,40px); pointer-events:none}
.brand{display:flex; align-items:center; gap:10px; font-weight:500; font-size:15px}
.logo{height:19px; width:auto; display:block}
.herologo{height:34px; width:auto; display:block; margin-bottom:24px}
.logo-d{display:none}
.ptag{color:var(--muted); font-weight:500; font-size:14px}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .logo-l{display:none} :root:not([data-theme="light"]) .logo-d{display:block} }
:root[data-theme="dark"] .logo-l{display:none} :root[data-theme="dark"] .logo-d{display:block}
.counter{color:var(--muted); font-weight:500; font-size:13px; font-variant-numeric:tabular-nums}

.stage{flex:1; display:flex; align-items:center; justify-content:center; padding:104px clamp(16px,5vw,40px) 44px; width:100%}
.card{width:100%; max-width:640px}
.eyebrow{display:inline-block; font-size:12px; letter-spacing:.16em; color:var(--cl,var(--greenink)); background:none; padding:0; margin-bottom:18px}
.q{font-size:clamp(23px,4.8vw,33px); line-height:1.1; margin:0}
.q em{font-style:normal; text-transform:none; background:var(--green-lt); color:var(--navy); padding:0 .18em; border-radius:5px; box-decoration-break:clone; -webkit-box-decoration-break:clone}
.sub{color:var(--muted); font-weight:300; font-size:16px; margin-top:14px; max-width:52ch}
.controls{margin-top:28px}

.btnrow{display:flex; gap:12px; align-items:center; margin-top:34px; flex-wrap:wrap}
button{font-family:inherit}
.btn{appearance:none; border:none; cursor:pointer; font-size:15px; letter-spacing:.02em; padding:15px 28px; border-radius:999px; transition:transform .12s, box-shadow .2s, background .2s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--btn); color:var(--on-btn); box-shadow:0 8px 20px -14px rgba(40,50,68,.55)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary[disabled]{opacity:.45; cursor:not-allowed; box-shadow:none}
.btn.ghost{background:transparent; color:var(--muted); padding:15px 12px}
.btn.ghost:hover{color:var(--ink)}
.skip{background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; text-decoration:underline; text-underline-offset:3px; padding:8px}
.skip:hover{color:var(--ink)}

.opts{display:flex; flex-direction:column; gap:10px}
.opts.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.opt{display:flex; align-items:center; gap:13px; text-align:left; width:100%; background:var(--surface); border:1.5px solid var(--line); color:var(--ink);
  padding:15px 16px; border-radius:16px; cursor:pointer; font-size:16px; font-weight:500; transition:border-color .15s, background .15s, transform .1s; line-height:1.3}
.opt:hover{border-color:var(--green); transform:translateY(-1px)}
.opt .em{font-size:21px; line-height:1; flex:none}
.opt .txt{display:flex; flex-direction:column; gap:2px}
.opt .txt small{font-weight:300; font-size:13px; color:var(--muted)}
.opt .tick{margin-left:auto; width:22px; height:22px; border-radius:8px; border:1.5px solid var(--line); flex:none; display:grid; place-items:center; color:transparent; font-size:13px; font-weight:700; transition:.15s}
.opt[aria-pressed="true"]{border-color:var(--green); background:var(--sel)}
.opt[aria-pressed="true"] .tick{background:var(--green); border-color:var(--green); color:#14312A}
.opts.single .opt .tick{border-radius:50%}

/* inputs */
.field{display:flex; align-items:center; gap:10px; background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:4px 18px; transition:border-color .15s, box-shadow .15s}
.field:focus-within{border-color:var(--green); box-shadow:0 0 0 4px var(--ring)}
.field .pre{color:var(--muted); font-weight:500; font-size:22px}
.field input{flex:1; border:none; outline:none; background:transparent; color:var(--ink); font-family:inherit; font-size:21px; font-weight:500; padding:15px 0; min-width:0}
.field.sm input{font-size:17px; padding:12px 0; font-weight:400}
textarea{width:100%; background:var(--surface); border:1.5px solid var(--line); border-radius:16px; color:var(--ink); font-family:inherit; font-weight:400; font-size:17px; line-height:1.5; padding:15px 16px; resize:vertical; min-height:110px; outline:none; transition:border-color .15s, box-shadow .15s}
textarea:focus{border-color:var(--green); box-shadow:0 0 0 4px var(--ring)}
.lbl{font-size:12px; letter-spacing:.08em; color:var(--muted); margin:0 0 8px 2px}
.hint{font-size:13px; font-weight:300; color:var(--muted); margin-top:12px}

/* sub-question block (reading → connect) */
.subq{margin-top:22px; padding:18px; border-radius:16px; background:var(--surface-2); border:1.5px dashed var(--line)}
.subq .sqq{font-weight:500; font-size:15.5px; margin:0 0 12px; display:flex; gap:9px; align-items:flex-start}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{background:var(--surface); border:1.5px solid var(--line); color:var(--ink); border-radius:999px; padding:9px 16px; font-size:14px; font-weight:500; cursor:pointer; transition:.15s}
.chip:hover{border-color:var(--green)}
.chip[aria-pressed="true"]{background:var(--green); border-color:var(--green); color:#14312A}

/* order / reorder ranking */
.ranked{display:flex; flex-direction:column; gap:9px; margin-bottom:14px}
.rank-item{display:flex; align-items:center; gap:10px; background:var(--surface); border:1.5px solid var(--rbd); border-radius:14px; padding:11px 12px}
.rank-item .rk{width:27px; height:27px; border-radius:50%; background:var(--rbg); color:var(--rfg); display:grid; place-items:center; font-weight:700; font-size:14px; flex:none}
.rank-item .rl{flex:1; font-weight:500; font-size:15.5px; min-width:0}
.rank-item .mv{width:34px; height:34px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface-2); cursor:pointer; font-size:14px; color:var(--ink); flex:none; display:grid; place-items:center}
.rank-item .mv:hover{border-color:var(--green)}
.rank-item .mv[disabled]{opacity:.3; cursor:default}
.rank-item .mv.rm{color:var(--red)}
.poollbl{font-size:12px; letter-spacing:.08em; color:var(--muted); margin:4px 0 10px 2px}

/* matrix (importance grid) */
.matrix{display:flex; flex-direction:column; gap:10px}
.mrow{background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:12px 14px}
.mrow .ml{font-weight:500; font-size:15px; margin-bottom:9px}
.mseg{display:flex; gap:7px}
.seg{flex:1; border:1.5px solid var(--line); background:var(--surface-2); color:var(--muted); border-radius:10px; padding:9px 6px; font-size:12.5px; font-weight:500; cursor:pointer; transition:.14s; line-height:1.15}
.seg:hover{border-color:var(--green)}
.seg[aria-pressed="true"][data-v="very"]{background:var(--green); border-color:var(--green); color:#14312A}
.seg[aria-pressed="true"][data-v="imp"]{background:var(--yellow-lt); border-color:var(--yellow); color:var(--navy)}
.seg[aria-pressed="true"][data-v="no"]{background:var(--line); border-color:var(--muted); color:var(--ink)}

/* scale */
.scale{display:flex; gap:8px; justify-content:space-between}
.scale button{flex:1; aspect-ratio:1/1; max-width:76px; border-radius:16px; border:1.5px solid var(--line); background:var(--surface); cursor:pointer; font-size:25px; display:grid; place-items:center; transition:.15s}
.scale button:hover{border-color:var(--green); transform:translateY(-2px)}
.scale button[aria-pressed="true"]{border-color:var(--green); background:var(--sel); transform:translateY(-2px)}
.scale-ends{display:flex; justify-content:space-between; color:var(--muted); font-size:13px; margin-top:10px}

/* interstitials */
.pane{border-radius:26px; padding:clamp(26px,6vw,44px); position:relative; overflow:hidden}
.pane.chapter{background:var(--navy); color:var(--beige)}
.pane.affirm{background:var(--green); color:#13302A}
.pane.dyk{background:var(--green); color:#13302A}
.pane .kick{font-size:12px; letter-spacing:.16em; opacity:.85}
.pane .ptitle{font-size:clamp(26px,6vw,40px); line-height:1.04; margin:12px 0 0}
.pane p.ptext{font-size:clamp(17px,3.2vw,21px); font-weight:300; line-height:1.4; margin:16px 0 0; max-width:42ch; position:relative; z-index:1}
.pane .won{display:inline-block; margin-top:18px; font-size:15px; font-weight:500}
.pane.chapter::after{content:""; position:absolute; right:-40px; bottom:-40px; width:180px; height:180px; border-radius:50%; background:rgba(255,255,255,.15)}
.pane.dyk::after{content:"🌱"; position:absolute; right:-6px; bottom:-20px; font-size:120px; opacity:.16}

.hero .big{font-size:clamp(36px,8.5vw,60px); line-height:.98}
.hero .big .amp{color:var(--amp2)}
.hero .big .amp2{color:var(--amp2)}
.hero .lede{font-size:clamp(17px,2.6vw,20px); font-weight:300; color:var(--muted); margin-top:20px; max-width:42ch}
.lede strong{color:var(--ink); font-weight:700}
.cal{display:flex; gap:10px; margin-top:8px}
.cal-gutter{width:40px; flex:none; position:relative; margin-top:30px}
.cal-hr{position:absolute; right:4px; transform:translateY(-50%); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.cal-cols{flex:1; display:flex; gap:10px; min-width:0}
.cal-col{flex:1; min-width:0}
.cal-col h4{margin:0 0 8px; font-size:13px; font-weight:700; text-align:center; color:var(--ink)}
.cal-track{position:relative; background:var(--surface-2); border:1.5px solid var(--line); border-radius:12px; overflow:hidden}
.cal-line{position:absolute; left:0; right:0; height:1px; background:var(--line); opacity:.55}
.cal-slot{position:absolute; left:6px; right:6px; border:1.5px solid var(--green); background:var(--surface); color:var(--ink); border-radius:9px; cursor:pointer; font-size:12.5px; font-weight:600; display:flex; align-items:center; justify-content:center; padding:0 2px; transition:.14s; box-shadow:0 1px 5px rgba(40,50,68,.08)}
.cal-slot:hover{transform:translateY(-1px)}
.cal-slot[aria-pressed="true"]{background:var(--green); border-color:var(--green); color:#10322A}
.cal-slot[aria-pressed="true"] span::after{content:" ✓"}
.cal-other{margin-top:16px}
.cal-block{position:absolute; left:6px; right:6px; border-radius:9px; border:1px dashed var(--line); background:repeating-linear-gradient(45deg, color-mix(in srgb,var(--line) 55%, var(--surface)), color-mix(in srgb,var(--line) 55%, var(--surface)) 6px, var(--surface-2) 6px, var(--surface-2) 12px); color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; text-align:center; padding:0 4px; cursor:not-allowed; opacity:.85}
.meta{display:flex; gap:22px; margin-top:26px; flex-wrap:wrap}
.meta span{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:14.5px}
.banner{margin-top:22px; display:inline-flex; gap:9px; align-items:center; background:var(--surface-2); color:var(--muted); border:1px solid var(--line); padding:9px 15px; border-radius:999px; font-size:13.5px; font-weight:500}
.cta-stats{display:flex; gap:14px; flex-wrap:wrap; margin:24px 0 4px}
.cta-stats .stat{background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:14px 18px; flex:1; min-width:120px}
.cta-stats .stat b{display:block; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:700; font-size:26px; color:var(--ink); font-variant-numeric:tabular-nums}
.cta-stats .stat span{font-size:13px; font-weight:300; color:var(--muted)}
.brandmark{margin-top:28px; font-size:13px; letter-spacing:.14em; color:var(--muted)}

.anim{animation:in .42s cubic-bezier(.2,.7,.3,1)}
@keyframes in{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){ .anim{animation:none} .rail>i{transition:none} }
@media (max-width:460px){ .opts.grid{grid-template-columns:1fr} .seg{font-size:12px; padding:9px 4px} }
:focus-visible{outline:3px solid var(--ring); outline-offset:2px; border-radius:8px}
</style>
</head>

const answers={}; let i=0;
const RID=(self.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2));
let _lastSig="";
function savePartial(status){
  if(PREVIEW) return;
  if(status!=="complete" && !Object.keys(answers).length) return; // nothing to save yet
  const payload={ response_id:RID, status:status||"partial", submitted_at:new Date().toISOString(), ...answers };
  const body=JSON.stringify(payload);
  const sig=(status||"partial")+"|"+JSON.stringify(answers);
  if(status!=="complete" && sig===_lastSig) return; // no change since last save
  _lastSig=sig;
  try{ fetch(ENDPOINT,{method:"POST",mode:"no-cors",keepalive:true,body}); }catch(e){}
}
addEventListener("pagehide",()=>{ if(!PREVIEW && navigator.sendBeacon && Object.keys(answers).length){

const num=v=>{ if(v==null||v==="") return null; const n=+String(v).replace(/[^\d.-]/g,""); return isNaN(n)?null:n; };
const isInter=t=>["intro","thanks","dyk","chapter","affirm"].includes(t);
const active=()=>STEPS.filter(s=>!s.when||s.when(answers));

function render(){
  const s=STEPS[i], list=active().filter(x=>!isInter(x.type)), act=active();
  curAcc=accentOf(s);
  const pos=act.indexOf(s);
  const ansBefore=act.slice(0,pos+1).filter(x=>!isInter(x.type)).length;
  const total=list.length;
  const frac = s.type==="thanks" ? 1 : (isInter(s.type)? ansBefore/total : (ansBefore-1)/total);
  bar.style.width=Math.max(0,Math.min(1,frac))*100+"%";
  bar.style.background="linear-gradient(90deg,"+curAcc.solid+","+curAcc.label+")";
  if(!isInter(s.type)){ counter.hidden=false; counter.textContent=ansBefore+" / "+total; } else counter.hidden=true;
  card.innerHTML=""; const el=document.createElement("div"); el.className="anim";
  el.style.setProperty("--cl",curAcc.label);
  el.innerHTML=TEMPLATES[s.type](s); card.appendChild(el); WIRE[s.type]?.(s,el);
  const f=el.querySelector("input:not([type=button]),textarea"); if(f && /name|text|euro|number|reading/.test(s.type)) f.focus();
  window.scrollTo(0,0);
}
function stepMove(dir){ let j=i;
  do{ j+=dir; }while(j>0 && j<STEPS.length-1 && STEPS[j].when && !STEPS[j].when(answers));
  i=Math.max(0,Math.min(STEPS.length-1,j)); go();
  if(STEPS[i].type!=="thanks") savePartial();
}
const next=()=>stepMove(1), back=()=>stepMove(-1);

    let lines=""; for(let g=s.axisStart;g<=s.axisEnd;g++){ lines+=`<div class="cal-line" style="top:${(g-s.axisStart)*hourH}px"></div>`; }
    let gut=""; for(let g=s.axisStart;g<=s.axisEnd;g++){ gut+=`<div class="cal-hr" style="top:${(g-s.axisStart)*hourH}px">${g}:00</div>`; }
    const cols=s.dayNames.map(([d,name])=>{
      const sl=s.slots.filter(x=>x.day===d).map(x=>{
        const top=(x.start-s.axisStart)*hourH, hgt=(x.end-x.start)*hourH, lab=fmt(x.start)+"–"+fmt(x.end);
        return `<button class="cal-slot" data-slot="${esc(name+" "+lab)}" aria-pressed="false" style="top:${top}px;height:${hgt}px"><span>${lab}</span></button>`;
      }).join("");
      const bl=(s.blockers||[]).filter(x=>x.day===d).map(x=>{
        const top=(x.start-s.axisStart)*hourH, hgt=(x.end-x.start)*hourH;
        return `<div class="cal-block" style="top:${top}px;height:${hgt}px"><span>${esc(x.label||"🤿 Deep Dive")}</span></div>`;
      }).join("");
      return `<div class="cal-col"><h4>${esc(name)}</h4><div class="cal-track" style="height:${H}px">${lines}${bl}${sl}</div></div>`;
    }).join("");
    return `${head(s)}<div class="controls"><div class="cal">
      <div class="cal-gutter" style="height:${H}px">${gut}</div>
      <div class="cal-cols">${cols}</div></div>
      <div class="cal-other"><div class="lbl disp">Another time works better?</div><div class="field sm"><input id="f_other" placeholder="Propose a slot, e.g. Mon 4–5pm"></div></div>
      </div>${navHTML(s,{canSkip:!!s.skippable})}`;
  },
  order:s=>`${head(s)}<div class="controls" data-order>
    <div class="ranked" data-ranked></div>
    <div class="poollbl disp" data-poollbl hidden>Tap to add</div>
    <div class="opts ${s.poolGrid?'grid':''}" data-pool></div></div>${navHTML(s,{canSkip:!!s.skippable})}`,
  reading:s=>`${head(s)}<div class="controls">
    <textarea id="f_v" placeholder="${esc(s.ph||"")}"></textarea>
    <div class="subq"><p class="sqq">🔗 ${esc(s.connectQ)}</p>
      <div class="chips">${["Yes, introduce us","Maybe, reach out to me first","Not right now"].map((t,k)=>`<button class="chip" data-c="${k}" aria-pressed="false">${esc(t)}</button>`).join("")}</div>
    </div></div>
    <div class="btnrow">${i>0?'<button class="btn ghost" data-back>← Back</button>':''}<button class="btn primary" data-primary>Continue</button><button class="skip" data-skip>Skip</button></div>`,
  matrix:s=>`${head(s)}<div class="controls matrix">
    ${s.rows.map((r,k)=>`<div class="mrow"><div class="ml">${esc(r)}</div><div class="mseg">
      ${s.cols.map(c=>`<button class="seg" data-row="${k}" data-v="${c[0]}" aria-pressed="false">${esc(c[1])}</button>`).join("")}</div></div>`).join("")}
    </div>${navHTML(s,{canSkip:!!s.skippable})}`,
  euro:s=>`${head(s)}<div class="controls"><div class="field"><span class="pre">€</span><input id="f_v" inputmode="numeric" placeholder="0" autocomplete="off"></div><div class="hint">Ballpark is fine.</div></div>${navHTML(s,{canSkip:!!s.skippable})}`,
  number:s=>`${head(s)}<div class="controls"><div class="field"><input id="f_v" inputmode="numeric" placeholder="0" autocomplete="off"></div></div>${navHTML(s,{canSkip:!!s.skippable})}`,
  text:s=>`${head(s)}<div class="controls">${s.multiline?`<textarea id="f_v" placeholder="${esc(s.ph||"")}"></textarea>`:`<div class="field"><input id="f_v" placeholder="${esc(s.ph||"")}"></div>`}</div>${navHTML(s,{canSkip:!!s.skippable})}`,
  scale:s=>`${head(s)}<div class="controls"><div class="scale">${s.icons.map((ic,k)=>`<button data-val="${k+1}" aria-pressed="false">${ic}</button>`).join("")}</div><div class="scale-ends"><span>${esc(s.left)}</span><span>${esc(s.right)}</span></div></div>${backOnly()}`,
  rating:s=>`${head(s)}<div class="controls"><div class="scale">${s.icons.map((ic,k)=>`<button data-val="${k+1}" aria-pressed="false" title="${esc(s.labels[k])}">${ic}</button>`).join("")}</div><div class="scale-ends"><span>${esc(s.labels[0])}</span><span>${esc(s.labels[s.labels.length-1])}</span></div></div>${backOnly()}`,
  thanks:()=>`<div class="hero"><h1 class="big disp" id="thx">That's it!<br>thank you 💛</h1><p class="lede" id="thxsub">Sending your pulse…</p><div id="cta"></div></div>`
};

const enableP=(el,on)=>{ const p=el.querySelector("[data-primary]"); if(p) p.disabled=!on; };
function wireNav(s,el,getVal){
  el.querySelector("[data-back]")?.addEventListener("click",back);
  el.querySelector("[data-skip]")?.addEventListener("click",()=>{ set(s.key,""); next(); });
  el.querySelector("[data-primary]")?.addEventListener("click",()=>{ const v=getVal?getVal():null; if(getVal){ if(v==null||v==="")return; set(s.key,v);} next(); });
}
const WIRE={
  intro:(s,el)=>el.querySelector("[data-go]").addEventListener("click",next),
  chapter:(s,el)=>{ el.querySelector("[data-back]")?.addEventListener("click",back); el.querySelector("[data-go]").addEventListener("click",next); },
  affirm:(s,el)=>{ el.querySelector("[data-back]")?.addEventListener("click",back); el.querySelector("[data-go]").addEventListener("click",next); },
  dyk:(s,el)=>{ el.querySelector("[data-back]")?.addEventListener("click",back); el.querySelector("[data-go]").addEventListener("click",next); },
  name:(s,el)=>{ const inp=el.querySelector("#f_name"); const go=()=>{ if(inp.value.trim()){ set("name",inp.value.trim()); next(); } };
    inp.addEventListener("input",()=>enableP(el,inp.value.trim().length>0));
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault(); go();} });
    el.querySelector("[data-primary]").addEventListener("click",go); },
  single:(s,el)=>{ el.querySelectorAll("[data-opt]").forEach(b=>b.addEventListener("click",()=>{ set(s.key,s.opts[+b.dataset.opt].t); b.setAttribute("aria-pressed","true"); setTimeout(next,170); }));
    el.querySelector("[data-back]")?.addEventListener("click",back); },
  multi:(s,el)=>{
    const chosen=new Set(); const ow=el.querySelector("[data-otherwrap]"); const oi=el.querySelector("#f_other");
    const upd=()=>enableP(el, chosen.size>0 || (ow&&!ow.hidden&&oi.value.trim()));
    el.querySelectorAll("[data-opt]").forEach(b=>b.addEventListener("click",()=>{
      const o=s.opts[+b.dataset.opt], on=b.getAttribute("aria-pressed")==="true";
      b.setAttribute("aria-pressed",String(!on));
      if(o.other){ ow.hidden=on; if(!on) setTimeout(()=>oi.focus(),30); }
      else { on?chosen.delete(o.t):chosen.add(o.t); }
      upd();
    }));
    oi&&oi.addEventListener("input",upd);
    wireNav(s,el,()=>{ const arr=[...chosen]; if(ow&&!ow.hidden&&oi.value.trim()) arr.push("Other: "+oi.value.trim()); return arr.join("; "); });
  },
  calendar:(s,el)=>{
    const chosen=new Set(); const oi=el.querySelector("#f_other");
    el.querySelectorAll(".cal-slot").forEach(b=>b.addEventListener("click",()=>{
      const v=b.dataset.slot, on=b.getAttribute("aria-pressed")==="true";
      b.setAttribute("aria-pressed",String(!on)); on?chosen.delete(v):chosen.add(v);
    }));
    enableP(el,true);
    el.querySelector("[data-back]")?.addEventListener("click",back);
    el.querySelector("[data-skip]")?.addEventListener("click",()=>{ set(s.key,""); next(); });
    el.querySelector("[data-primary]")?.addEventListener("click",()=>{ const a=[...chosen]; if(oi&&oi.value.trim()) a.push("Other: "+oi.value.trim()); set(s.key,a.join("; ")); next(); });
  },
  order:(s,el)=>{
    const pool=s.pool.slice(); const order=[];
    const rk=el.querySelector("[data-ranked]"), pl=el.querySelector("[data-pool]"), plbl=el.querySelector("[data-poollbl]");
    function paint(){
      rk.innerHTML=order.map((lab,idx)=>`<div class="rank-item"><span class="rk">${idx+1}</span><span class="rl">${esc(lab)}</span>
        <button class="mv" data-up="${idx}" ${idx===0?"disabled":""}>▲</button>
        <button class="mv" data-dn="${idx}" ${idx===order.length-1?"disabled":""}>▼</button>
        <button class="mv rm" data-rm="${idx}">✕</button></div>`).join("");
      const rest=pool.filter(p=>!order.includes(p));
      plbl.hidden = rest.length===0;
      pl.innerHTML=rest.map(lab=>`<button class="opt" data-add="${esc(lab)}"><span class="txt"><span>${esc(lab)}</span></span><span class="tick" style="color:var(--muted);border:none;font-size:18px">＋</span></button>`).join("");
      enableP(el, s.optional||order.length>0);
    }
    el.querySelector("[data-order]").addEventListener("click",e=>{
      const a=e.target.closest("[data-add]"), up=e.target.closest("[data-up]"), dn=e.target.closest("[data-dn]"), rm=e.target.closest("[data-rm]");
      if(a){ order.push(a.getAttribute("data-add")); paint(); }
      else if(up){ const k=+up.dataset.up; [order[k-1],order[k]]=[order[k],order[k-1]]; paint(); }
      else if(dn){ const k=+dn.dataset.dn; [order[k+1],order[k]]=[order[k],order[k+1]]; paint(); }
      else if(rm){ order.splice(+rm.dataset.rm,1); paint(); }
    });
    paint();
    el.querySelector("[data-back]")?.addEventListener("click",back);
    el.querySelector("[data-skip]")?.addEventListener("click",()=>{ set(s.key,""); next(); });
    el.querySelector("[data-primary]")?.addEventListener("click",()=>{ if(!s.optional && order.length===0) return; set(s.key, order.join(" > ")); next(); });
  },
  reading:(s,el)=>{
    const ta=el.querySelector("#f_v"); let connect="";
    el.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
      const on=c.getAttribute("aria-pressed")==="true";
      el.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));
      if(!on){ c.setAttribute("aria-pressed","true"); connect=c.textContent; } else connect="";
    }));
    const go=()=>{ set("reading",ta.value.trim()); set("connect_consent",connect); next(); };
    el.querySelector("[data-primary]").addEventListener("click",go);
    el.querySelector("[data-skip]").addEventListener("click",()=>{ set("reading",""); set("connect_consent",connect); next(); });
    el.querySelector("[data-back]")?.addEventListener("click",back);
  },
  matrix:(s,el)=>{
    const rated={};
    el.querySelectorAll(".seg").forEach(b=>b.addEventListener("click",()=>{
      const r=+b.dataset.row;
      el.querySelectorAll(`.seg[data-row="${r}"]`).forEach(x=>x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true"); rated[r]=b.dataset.v;
      enableP(el, Object.keys(rated).length>0);
    }));
    const labelOf={very:"Very important",imp:"Important",no:"Doesn't affect me"};
    wireNav(s,el,()=>s.rows.map((r,k)=>rated[k]?`${r} = ${labelOf[rated[k]]}`:null).filter(Boolean).join("; "));
  },
  euro:(s,el)=>numField(s,el,true),
  number:(s,el)=>numField(s,el,false),
  text:(s,el)=>{ const inp=el.querySelector("#f_v"); enableP(el,true);
    if(!s.multiline) inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault(); set(s.key,inp.value.trim()); next();} });
    el.querySelector("[data-back]")?.addEventListener("click",back);
    el.querySelector("[data-skip]")?.addEventListener("click",()=>{ set(s.key,""); next(); });
    el.querySelector("[data-primary]")?.addEventListener("click",()=>{ set(s.key,inp.value.trim()); next(); }); },
  scale:(s,el)=>pick(s,el),
  rating:(s,el)=>pick(s,el)
};
function numField(s,el,isEuro){ const inp=el.querySelector("#f_v");
  inp.addEventListener("input",()=>{ inp.value=inp.value.replace(/[^\d]/g,""); if(isEuro&&inp.value) inp.value=(+inp.value).toLocaleString("en-US"); enableP(el,inp.value.trim().length>0); });
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault(); const v=inp.value.replace(/,/g,""); if(v){set(s.key,v); next();}} });
  wireNav(s,el,()=>inp.value.replace(/,/g,"")); }
function pick(s,el){ el.querySelectorAll(".scale button").forEach(b=>b.addEventListener("click",()=>{
    el.querySelectorAll(".scale button").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); set(s.key,b.dataset.val); setTimeout(next,190); }));
  el.querySelector("[data-back]")?.addEventListener("click",back); }

async function submit(){
  const payload={ response_id:RID, status:"complete", submitted_at:new Date().toISOString(), ...answers };
  const thx=document.getElementById("thx"), sub=document.getElementById("thxsub"), cta=document.getElementById("cta");
  const name=(answers.name||"").split(" ")[0];
  const eur=num(answers.planned_eur), deals=num(answers.planned_commitments);
  const topV=(answers.verticals_ranked||"").split(" > ")[0]||"";
  const bits=[];
  if(eur) bits.push(`<div class="stat"><b>€${(+eur).toLocaleString("en-US")}</b><span>you're ready to deploy in Q4</span></div>`);
  if(deals) bits.push(`<div class="stat"><b>${deals}</b><span>more deals on your radar</span></div>`);
  if(topV) bits.push(`<div class="stat"><b style="font-size:19px">${esc(topV)}</b><span>your #1 space right now</span></div>`);
  function closing(saved){
    if(thx) thx.innerHTML = name?`Thank you,<br>${esc(name)} 💛`:"That's it!<br>thank you 💛";
    sub.innerHTML = saved===false ? "Preview mode, nothing was saved. Add your Sheet URL to go live." : "We read every single one, and you'll feel it in what we send you next.";
    cta.innerHTML = (bits.length?`<div class="cta-stats">${bits.join("")}</div>`:"")
      + `<p class="lede" style="margin-top:18px">everdrop could have been one of these. The pipeline is live right now, your next breakout might be a tap away.</p>
      <div class="btnrow"><a class="btn primary" href="${SPACE_URL}" target="_blank" rel="noopener">See what's live now →</a></div>
      <div class="brandmark disp">Doing good better.</div>`;
    bar.style.width="100%";
  }
  if(PREVIEW){ closing(false); return; }
  try{ await fetch(ENDPOINT,{method:"POST",mode:"no-cors",body:JSON.stringify(payload)}); closing(true); }
  catch(e){ sub.textContent="Hmm, the connection hiccuped. One more try?";
    const r=document.createElement("button"); r.className="btn primary"; r.textContent="Try again"; r.style.marginTop="16px";
    r.onclick=()=>{ sub.textContent="Sending…"; r.remove(); submit(); }; sub.after(r); bar.style.width="100%"; }
}
document.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const p=card.querySelector("[data-primary]:not([disabled]), [data-go]");
  if(p && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName)) p.click(); } });
function go(){ render(); if(STEPS[i].type==="thanks") submit(); }
go();
</script>
